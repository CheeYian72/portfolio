const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const BC=m=>{try{const a=JSON.parse(localStorage.getItem('bc')||'[]');a.push('gate '+m);localStorage.setItem('bc',JSON.stringify(a.slice(-30)))}catch(e){}};
async function unlock(pw){try{localStorage.setItem('bc','[]')}catch(e){}BC('unlock start');
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c)));
  BC('decrypted '+html.length);
  try{sessionStorage.setItem('qk',pw);setTimeout(()=>{try{sessionStorage.removeItem('qt')}catch(e){}},8000)}catch(e){}
  BC('write');document.open();document.write(html);document.close();
}
const f=document.getElementById('f'),p=document.getElementById('p'),b=document.getElementById('b'),m=document.getElementById('m');
f.addEventListener('submit',async e=>{e.preventDefault();if(!p.value)return;b.disabled=true;m.textContent='VERIFYING…';
